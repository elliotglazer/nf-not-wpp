# These generated modules make Lean's constructor-name style linter exhaust
# its private deterministic heartbeat budget after elaboration. Keep the proof
# checker settings identical. This target adds exactly one Lake-level override,
# disabling that non-semantic linter for the demonstrated modules; linter
# settings already embedded in the generated sources remain unchanged.
[[lean_lib]]
name = "NFNotWPPLinterHeavy"
srcDir = "Proof"
roots = [
  "NominalWPPReplayChunk009StructuralPart030",
  "NominalWPPReplayChunk009StructuralPart038"
]
moreLeanArgs = ["--threads=1", "-DmaxHeartbeats=5000000", "-DmaxRecDepth=30000", "-Dlinter.constructorNameAsVariable=false"]

# Public standard-NF equivalence and final `NF ⊢ ¬WPP` endpoints.  Imports are
# followed from this umbrella root, so this target does not enumerate or rebuild
# the full generated replay closure as additional roots.
[[lean_lib]]
name = "NFStandard"
srcDir = "Proof"
roots = ["NFStandard"]
moreLeanArgs = ["--threads=1", "-DmaxHeartbeats=5000000", "-DmaxRecDepth=30000"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
