  - title: "MathOverflow discussion of the partition principle in NF"
    authors: ["Thomas Forster"]
    id: "https://mathoverflow.net/a/449571/109573"
    location: "MathOverflow answer, 2023"
    relationship: "background"
    note: >-
      Public background evidence that the corresponding partition-principle
      question for NF was regarded as open in 2023. It supports the qualified
