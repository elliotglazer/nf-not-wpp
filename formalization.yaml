    id: "https://github.com/metamath/set.mm/blob/c1814c4fbaf88d329d7d73ec1c7358647570e435/nf.mm"
    location: "Upstream nf.mm basis; exact content and relationship to the project extension are recorded in provenance/METAMATH_PROVENANCE.md"
    relationship: "adapts"
    note: >-
      The uploaded nf.mm is byte-identical to the immutable blob at the cited
      commit (SHA-256 727A3707545E13EC53F03502EB07DC4635A8C176F275D4014A17FBD823E66083).
      The exact historical whole-repository checkout is not known. The WPP
      endpoint is supplied by the project-authored extension identified in the
      next source entry, not by upstream nf.mm alone.
    license: "CC0-1.0"
  - title: "Project Metamath WPP extension and accepted strict-scope endpoint source"
    id: "provenance/metamath/accepted-translator-input.mm"
    location: "theorem wppfiniteblocknotwppndv, semantic theorem ordinal 4321"
    relationship: "formalizes"
    license: "Apache-2.0"
    note: >-
      The packaged 9,945,323-byte source is exactly the accepted translator
      input (SHA-256 868DF831E63E28AA924CC099510CD9E5D3BE18CD8416A20B335F5BBF3B42ED3F).
      Its endpoint has no hypotheses or mandatory DV pairs, expression
      '|- -. WPP', and nominal AST '(wn wwpp)'. The content-addressed 19-stage
      repair account, including the one assertion-syntax repair and all
      proof-only rebuilds, is in provenance/METAMATH_PROVENANCE.md and
      provenance/provenance.json. The finite-basis portion of the Lean
      development is a source-based port of that exact formal proof; the public
      theorem additionally transports it to standard NF.
  - title: "New Foundations Refutes the Weak Partition Principle"
    id: "archive/paper/NF_Refutes_WPP_Unconditional_Proof.pdf"
    type: "paper"
    location: "Unpublished manuscript, August 2026, 12 pages"
    relationship: "formalizes"
    note: >-
      This is the exact informal manuscript named by the retained
      manuscript-to-Metamath contract ledger. The repository includes both
      its TeX source and rendered PDF; the ledger maps its proof blocks to
      wppfiniteblocknotwppndv. The PDF SHA-256 is
      6318E3E73785AEF9B935F4353DBEB14F19EFD1667B4A6BB13C99018EE14ADC6D.
      The manuscript is published without an author attribution and is
      covered by the repository's Apache-2.0 licence.
    license: "Apache-2.0"
  - title: "The Axiom of Choice in Quine's New Foundations for Mathematical Logic"
    authors: ["Ernst P. Specker"]
    id: "https://doi.org/10.1073/pnas.39.9.972"
    type: "paper"
    location: "Proceedings of the National Academy of Sciences 39(9), 972-975 (1953)"
    relationship: "background"
    note: >-
      Historical source for the failure of choice in NF. The submitted result
      is the more specific not-WPP endpoint in the retained Metamath proof and
      is not represented as a line-by-line formalization of Specker's paper.
  - title: "The Axiom of Choice and the Partition Principle from Dialectica Categories"
    authors: ["Samuel G. da Silva"]
    id: "https://doi.org/10.1093/jigpal/jzaa023"
    type: "paper"
    location: "Logic Journal of the IGPL 29(5), 783-797 (2021), Definition 2.1"
    relationship: "background"
    note: >-
