# formalization.yaml v0.4 -- publication metadata.
#
# The mathematical/provenance fields below are filled from retained evidence.
# Public upload, protected verification, and submission remain subject to the
# release checks in PALOMAR_CHECKLIST.md.
version: "v0.4"
project:
  name: "NF proves the negation of WPP"
  description: >-
    A Lean 4 proof that standard first-order New Foundations (NF), axiomatized
    by extensionality and the full stratified-comprehension schema, syntactically
    derives the negation of the Weak Partition Principle (WPP). The translated
    Metamath proof enters through eleven literal Hailperin sentences, which are
    used internally as a finite-basis bridge and are proved deductively
    equivalent to standard NF.
  # Confirmed by the responsible human on 2026-08-24.
  authors:
    - "Elliot Glazer"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Elliot Glazer"

# This is intended to become a substantive-development repository, not a thin
# Comparator wrapper. Do not add repository.substantive_formalization unless
# that packaging decision changes.

classification:
  arxiv: ["math.LO"]
  msc2020: ["03E70", "03E25", "03B35"]

sources:
