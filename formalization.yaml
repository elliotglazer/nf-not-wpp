# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 -- publication metadata.
#
# The mathematical/provenance fields below are filled from retained evidence.
# Public upload, protected verification, and submission remain subject to the
# release checks in PALOMAR_CHECKLIST.md.
version: "v0.4"
project:
  name: "NF (Hailperin axiomatization) proves the negation of WPP"
  description: >-
    A Lean 4 syntactic formalization of the Metamath New Foundations result
    that the first-order theory generated by the eleven literal Hailperin NF
    axioms derives the negation of the weak partition principle (WPP).
  # Confirmed by the responsible human on 2026-08-24.
  authors:
    - "Elliot Glazer"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Elliot Glazer"

# This is intended to become a substantive-development repository, not a thin
# Comparator wrapper. Do not add repository.substantive_formalization unless
# that packaging decision changes.

classification:
  arxiv: ["math.LO"]
  msc2020: ["03E70", "03E25", "03B35"]

sources:
  - title: "Metamath New Foundations Explorer basis (nf.mm)"
    id: "https://github.com/metamath/set.mm/blob/c1814c4fbaf88d329d7d73ec1c7358647570e435/nf.mm"
    location: "Upstream nf.mm basis; exact content and relationship to the project extension are recorded in provenance/METAMATH_PROVENANCE.md"
    relationship: "adapts"
    note: >-
      The uploaded nf.mm is byte-identical to the immutable blob at the cited
      commit (SHA-256 727A3707545E13EC53F03502EB07DC4635A8C176F275D4014A17FBD823E66083).
      The exact historical whole-repository checkout is not known. The WPP
      endpoint is supplied by the project-authored extension identified in the
      next source entry, not by upstream nf.mm alone.
    license: "CC0-1.0"
  - title: "Project Metamath WPP extension and accepted strict-scope endpoint source"
    id: "provenance/metamath/accepted-translator-input.mm"
    location: "theorem wppfiniteblocknotwppndv, semantic theorem ordinal 4321"
    relationship: "formalizes"
    note: >-
      The packaged 9,945,323-byte source is exactly the accepted translator
      input (SHA-256 868DF831E63E28AA924CC099510CD9E5D3BE18CD8416A20B335F5BBF3B42ED3F).
      Its endpoint has no hypotheses or mandatory DV pairs, expression
      '|- -. WPP', and nominal AST '(wn wwpp)'. The content-addressed 19-stage
      repair account, including the one assertion-syntax repair and all
      proof-only rebuilds, is in provenance/METAMATH_PROVENANCE.md and
      provenance/provenance.json. This is a source-based port of that exact
      formal proof; the repository makes no claim that the result is novel.
  - title: "The Axiom of Choice in Quine's New Foundations for Mathematical Logic"
    authors: ["Ernst P. Specker"]
    id: "https://doi.org/10.1073/pnas.39.9.972"
    type: "paper"
    location: "Proceedings of the National Academy of Sciences 39(9), 972-975 (1953)"
    relationship: "background"
    note: >-
      Historical source for the failure of choice in NF. The submitted result
      is the more specific not-WPP endpoint in the retained Metamath proof and
      is not represented as a line-by-line formalization of Specker's paper.
  - title: "The Axiom of Choice and the Partition Principle from Dialectica Categories"
    authors: ["Samuel G. da Silva"]
    id: "https://doi.org/10.1093/jigpal/jzaa023"
    type: "paper"
    location: "Logic Journal of the IGPL 29(5), 783-797 (2021), Definition 2.1"
    relationship: "background"
    note: >-
      Records the standard terminology and surjection/injection formulation of
      the Weak Partition Principle. The exact submitted formula remains the
      transparently expanded Metamath `df-wpp` sentence.

related_formalizations:
  - id: "https://github.com/metamath/set.mm"
    relationship: "adapts"
    note: >-
      The Lean development transports a theorem from the Metamath NF database
      into an explicit first-order syntactic deduction judgment.

status:
  scope: >-
    The advertised result is syntactic derivability of not-WPP from exactly
    eleven literal Hailperin NF object-theory axioms. It is a Lean transport of
    the accepted Metamath proof, not a consistency result for NF, a model
    construction, or a claim of a new mathematical refutation of WPP.
  # Challenge.lean's deliberate statement sorry is excluded from these counts.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "NFNotWPP.hailperinNF_proves_not_WPP"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI Codex (GPT-5)"]
      framework: "OpenAI Codex"
      tool_setup: >-
        AI agents translated and debugged the Metamath proof, generated the
        Lean proof terms, built the constructor-for-constructor proof bridge,
        and ran trust-zero and release audits. The human selected the theorem,
        required the exact syntactic target and three-axiom trust boundary, and
        supplied mathematical and strategic guidance.
      cost:
        wall_time: >-
          Intermittent supervised work from 2026-08-16 through 2026-08-24;
          active agent-hours were not separately tracked.
        spend_usd: "Not tracked"
        hardware: >-
          Local Windows x86-64 workstation plus OpenAI-hosted inference;
          remote hardware details were not exposed.
      prompting_notes: >-
        The human requested a literal port of the Metamath derivation, insisted
        that the result use only the standard Lean axioms propext, Quot.sound,
        and Classical.choice, and redirected the work toward directly
        instantiating syntax constructors and structurally translating the
        eight first-order proof rules. Agents then iterated against Lean's
        checker and packaged the accepted source closure.
  spend_usd: "Not tracked"
  notes: >-
    A primary Codex agent performed the translation and packaging with
    parallel agent passes over the proof bridge, Challenge/Solution boundary,
    provenance, and Palomar release surface. The human fixed the mathematical
    scope, confirmed authorship, maintenance responsibility, and the repository
    licence, and retains authority over public upload and submission. No
    independent human peer review is claimed.

fidelity:
  divergences: >-
    The accepted Metamath input follows the content-addressed 19-stage repair
    chain recorded in provenance/METAMATH_PROVENANCE.md. Most stages only
    change scoping, labels, compression, or proof terms; df-lnwmap has one
    recorded parenthesization correction, and 23 proved helper theorems were
    inserted as proofs rather than assumptions. In the Challenge, membership
    is a primitive atom instead of Flypitch's two-node relation application,
    and intrinsically scoped closed formulas are erased to Nat-indexed de
    Bruijn syntax. Both are structural presentation isomorphisms. The exact
    source ordered pair and WPP expansion are retained, and the theory is the
    range of exactly the eleven literal Hailperin formulas.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The accepted generated endpoint passed local Lean trust-zero, dependency,
    and exact-three-axiom audits. The packaged Challenge compiles with only its
    deliberate final placeholder. The standalone Solution repeats the complete
    declaration prefix exactly, contains no proof hole or custom assumption,
    compiles at trust zero, and reports exactly propext, Classical.choice, and
    Quot.sound. Its nominal WPP AST comparison and an empty-origin,
    diagnosed/resumed source-only build also passed. An uninterrupted
    final-configuration cold build, Linux Comparator, export, NanoDa, and
    public-commit evidence remain release gates; reviewers must be named only
    with their authorization.

alignment:
  namespace: "NFNotWPP"
  statements:
    - source: >-
        Packaged accepted-translator-input.mm project-extension theorem
        wppfiniteblocknotwppndv (endpoint ordinal 4321)
      lean: "NFNotWPP.hailperinNF_proves_not_WPP"
      module: "Solution"
      status: "proved"
      note: >-
        The direct C18 endpoint Nominal.NPrf (.neg syn_wwpp) is instantiated at
        the identity environment and structurally translated across the eight
        primitive Flypitch proof constructors. Formula, theory, and nominal
        lowering maps identify its exact conclusion and eleven-axiom theory
        with the independently stated Challenge calculus.

acknowledgements: >-
  This work builds on the Metamath New Foundations Explorer, Flypitch, Lean 4,
  and Mathlib communities. Strategic discussion with New Foundations and Lean
  contributors motivated the direct constructor-level syntactic bridge; no
  named-person endorsement is implied.
