related_formalizations:
  - id: "https://github.com/metamath/set.mm"
    relationship: "adapts"
    note: >-
      The Lean development transports a theorem from the Metamath NF database
      into an explicit first-order syntactic deduction judgment.

status:
  scope: >-
    The advertised result is `NFNotWPP.NF_proves_not_WPP`: syntactic
    derivability of not-WPP from standard first-order NF, where `NF` consists
    of extensionality and every instance of the full stratified-comprehension
    schema. The eleven literal Hailperin sentences are an internal translated
    finite-basis bridge, not the assumptions of the public theorem; the
    repository proves their full deductive equivalence with standard NF. This
    is not a consistency theorem or an assertion that NF has a model. To the
    best of our knowledge, the headline result `NF ⊢ ¬WPP` is novel; the
    cited 2023 MathOverflow answer records the corresponding question as open.
  # Challenge.lean's deliberate statement sorry is excluded from these counts.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "NFNotWPP.NF_proves_not_WPP"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "other"
      framework: "Project Metamath-to-Lean translator"
      tool_setup: >-
        A standard-library-only CPython 3.12 translator parses and verifies
        the accepted Metamath proof stack, maps its syntax and primitive proof
        steps to the frozen Flypitch/nominal constructor profile, and emits
        deterministic Lean source. The repository preserves the historical
        implementations, their textual receipts, and a portable launcher;
        the translator does not invoke Lean and is outside the trusted proof
        checker.
    - method: "agent"
      models: ["OpenAI Codex (GPT-5)"]
      framework: "OpenAI Codex"
      tool_setup: >-
        AI agents translated and debugged the Metamath proof, generated the
        Lean proof terms, built the constructor-for-constructor finite-basis
        bridge, formalized standard stratification and comprehension, and
        proved both model directions between standard NF and Hailperin's finite
        presentation. They then used first-order completeness to obtain full
        deductive equivalence and migrated the public theorem to standard NF.
        Local component and axiom audits were run; the protected release checks
        listed below remain pending. The human selected the theorem, required
        the exact syntactic target and three-axiom trust boundary, and supplied
        mathematical and strategic guidance.
      cost:
        wall_time: >-
          Intermittent supervised work from 2026-08-16 through 2026-08-24;
          active agent-hours were not separately tracked.
        spend_usd: "Not tracked"
        hardware: >-
          Local Windows x86-64 workstation plus OpenAI-hosted inference;
          remote hardware details were not exposed.
      prompting_notes: >-
        The human requested a literal port of the Metamath derivation, insisted
        that the result use only the standard Lean axioms propext, Quot.sound,
        and Classical.choice, and then required a public theorem over standard
        NF together with a proof that standard NF and Hailperin's axioms are
        equivalent. Agents directly instantiated syntax constructors,
        structurally translated the eight first-order proof rules, constructed
        the semantic operations needed in both model directions, used
        first-order completeness for consequence transport, iterated against
        Lean's checker, and packaged the accepted source closure.
  spend_usd: "Not tracked"
  notes: >-
    A primary Codex agent performed the translation and packaging with
    parallel agent passes over the proof bridge, Challenge/Solution boundary,
    standard-NF equivalence layer, provenance, and Palomar release surface. The
    human fixed the mathematical scope, confirmed authorship, maintenance
    responsibility, and the repository licence, authorized public upload to
    elliotglazer/nf-not-wpp, and retains authority over Palomar submission. No
    independent human peer review is claimed.

fidelity:
  divergences: >-
    The accepted Metamath input follows the content-addressed 19-stage repair
    chain recorded in provenance/METAMATH_PROVENANCE.md. Most stages only
    change scoping, labels, compression, or proof terms; df-lnwmap has one
    recorded parenthesization correction, and 23 proved helper theorems were
    inserted as proofs rather than assumptions. In the shared statement
    surface, membership is a primitive atom instead of Flypitch's two-node relation application,
    and intrinsically scoped closed formulas are erased to Nat-indexed de
    Bruijn syntax. Both are structural presentation isomorphisms. The exact
    source ordered pair and WPP expansion are retained. The exact eleven
    literal Hailperin formulas remain as the internal target of the translated
    C18 proof, but they are not the public theory: the shared Surface defines
    standard `NF` as extensionality plus all certified stratified-comprehension
    instances. The development proves that standard NF, the repository's
    `HailperinNF`, and the exact `LiteralHailperinNF` presentation have the same
    models and formal consequences. The final proof replaces every translated
    finite-basis axiom leaf by a derivation from standard NF.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The accepted generated endpoint passed local Lean trust-zero, dependency,
    and exact-three-axiom audits. The standard-NF model equivalence and
    `NF ⊢ ¬WPP` endpoint have also passed local module and axiom audits,
    reporting exactly propext, Classical.choice, and Quot.sound. The earlier
    literal-basis Challenge/Solution and its nominal WPP AST comparison passed
    locally, as did an empty-origin, diagnosed/resumed build of the translated
    source closure. Public CI run #10 completed the standard-NF proof graph in
    about 2 h 42 min without an OOM and reached Comparator. Comparator exposed
    import-sensitive elaboration in the formerly duplicated statement surface;
    Challenge and Solution now import one proof-free compiled Surface. The
    corrected Linux Comparator, export, NanoDa, and exact-public-commit evidence
    remain release gates; reviewers must be named only with their authorization.

alignment:
  namespace: "NFNotWPP"
  statements:
    - source: >-
        Packaged accepted-translator-input.mm project-extension theorem
        wppfiniteblocknotwppndv (endpoint ordinal 4321)
      lean: "NFNotWPP.NF_proves_not_WPP"
      module: "Solution"
      status: "proved"
      note: >-
        The direct C18 endpoint Nominal.NPrf (.neg syn_wwpp) is instantiated at
        the identity environment and structurally translated across the eight
        primitive Flypitch proof constructors into the exact eleven-sentence
        `LiteralHailperinNF` bridge. Formula and nominal-lowering maps identify
        its exact conclusion with the independently stated Challenge target.
        Each finite-basis axiom leaf is then replaced by a formal derivation
        from `NF`, which the shared Challenge/solution Surface defines as
        extensionality plus the full stratified-comprehension schema. The
        repository separately proves full
        deductive equivalence between standard NF and both Hailperin
        presentations.

acknowledgements: >-
  This work builds on the Metamath New Foundations Explorer, Flypitch, Lean 4,
  and Mathlib communities. Thomas Forster's 2023 MathOverflow answer is cited
  as public evidence about the question's prior open status. Strategic
  discussion with New Foundations and Lean contributors motivated the direct
  constructor-level syntactic bridge; citation or acknowledgment does not imply
  endorsement.
