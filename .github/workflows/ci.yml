name: CI

# Adapted from PalomarTemplate commit
# 128a6c5ce5f48622e69927ccd639cbff401022e8.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Check metadata and Apache licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - name: Test the metadata validator
        run: ruby test/validate_formalization_test.rb
      - name: Reject unresolved publication metadata
        # Reject any future reintroduction of publication placeholders or a
        # repository licence other than the confirmed Apache-2.0 choice.
        run: ruby scripts/validate-formalization.rb
      - name: Detect the Apache licence
        # The root file must remain recognisable as exactly Apache-2.0.
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  submission-link:
    name: Check where the README sends a submitter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the submission form the README names
        # Require the current destination as well as rejecting the retired one;
        # a missing or misspelt link would pass a negative-only check. Limit the
        # rejection to Palomar's form because other issue trackers are valid.
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          form = "https://submit.palomar-registry.org/"
          retired = re.compile(r"PalomarSubmission/issues/new")
          failed = False
          if form not in pathlib.Path("README.md").read_text():
              print(f"README.md: does not send a submitter to {form}")
              failed = True
          for document in sorted(pathlib.Path(".").rglob("*.md")):
              if ".lake" in document.parts:
                  continue
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  if retired.search(line):
                      print(f"{document}:{number}: that submission form was deleted; submissions go to {form}")
                      failed = True
          raise SystemExit(failed)
          PY

  research-archive:
    name: Verify the paper, intermediates, and translator archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Rehash every retained archive file
        run: python3 scripts/verify-archive.py
      - name: Rehash the packaged translated-replay source closure
        run: python3 scripts/verify-source-closure.py
      - name: Reproduce the final translated C18 source
        run: python3 translation/reproduce_c18.py "$RUNNER_TEMP/c18-replay"
      - name: Reproduce the memory-bounded WPP FV packaging
        run: python3 translation/reproduce_wpp_fv_split.py

  sandbox:
    name: Check the Landrun wrapper's flag policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test the Landrun wrapper
        run: ./test/landrun_wrapper_test.sh

  build:
    name: Build Challenge with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the self-contained Challenge and clean Solution surface agree
        run: python3 scripts/verify-statement-mirror.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
          build-args: "Challenge"

  comparator:
    name: Check statement against solution
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LEAN_NUM_THREADS: "1"
      PALOMAR_SWAP_GIB: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
          cache: false
      - name: Provision virtual memory for the measured Lean peak
        shell: bash
        run: |
          set -euo pipefail
          swap_dir="$RUNNER_TEMP"
          available_kib=$(df -Pk "$swap_dir" | awk 'NR == 2 { print $4 }')
          if [ -d /mnt ]; then
            mnt_available_kib=$(df -Pk /mnt | awk 'NR == 2 { print $4 }')
            if [ -n "$mnt_available_kib" ] && [ "$mnt_available_kib" -gt "${available_kib:-0}" ]; then
              swap_dir=/mnt
              available_kib=$mnt_available_kib
            fi
          fi
          swap_file="$swap_dir/nf-not-wpp.swap"
          swap_kib=$((PALOMAR_SWAP_GIB * 1024 * 1024))
          required_kib=$((swap_kib + 2 * 1024 * 1024))
          if [ -z "$available_kib" ] || [ "$available_kib" -lt "$required_kib" ]; then
            echo "error: need ${required_kib} KiB for swap plus build reserve; ${available_kib:-unknown} KiB available" >&2
            exit 1
          fi
          if [ -r /sys/fs/cgroup/memory.swap.max ] && [ "$(cat /sys/fs/cgroup/memory.swap.max)" = 0 ]; then
            echo "error: this runner's cgroup forbids swap" >&2
            exit 1
          fi
          sudo fallocate -l "${PALOMAR_SWAP_GIB}G" "$swap_file"
          sudo chmod 600 "$swap_file"
          sudo mkswap "$swap_file"
          sudo swapon "$swap_file"
          swapon --show
      - name: Run pinned Comparator toolchain
        run: ./scripts/verify-comparator.sh
